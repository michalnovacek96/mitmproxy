name: Release

# Push a tag like v1.2.0 -> GitHub Release with the addon and installer attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches __version__
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' app_tracking_debugger.py)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $VERSION" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app_tracking_debugger.py install.sh \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
